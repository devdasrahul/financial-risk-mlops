global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'financial_risk_inference_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['inference-service:8000', 'host.docker.internal:8000', 'localhost:8000']
        labels:
          environment: 'production'
          service: 'fraud-risk-engine'
          model: 'fraud-detection-xgb'
