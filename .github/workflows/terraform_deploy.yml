name: Terraform AWS Infrastructure Provisioning & Teardown

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to execute'
        required: true
        default: 'clean-and-apply'
        type: choice
        options:
          - clean-and-apply
          - apply
          - plan
          - destroy
          - cleanup-only

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install boto3 botocore

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup S3 State Bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="fraud-risk-mlops-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_ENV
          if ! aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null; then
            echo "Creating state bucket ${STATE_BUCKET}..."
            aws s3api create-bucket --bucket "${STATE_BUCKET}" --region ${{ env.AWS_REGION }}
            aws s3api put-bucket-versioning --bucket "${STATE_BUCKET}" --versioning-configuration Status=Enabled
          fi

      - name: Pull Remote Terraform State
        run: |
          mkdir -p terraform
          aws s3 cp s3://${{ env.STATE_BUCKET }}/terraform.tfstate terraform/terraform.tfstate || true

      - name: Clean Orphaned Resources
        if: ${{ github.event.inputs.action == 'clean-and-apply' || github.event.inputs.action == 'cleanup-only' }}
        run: |
          python scripts/aws_cleanup_orphans.py

      - name: Terraform Init
        if: ${{ github.event.inputs.action != 'cleanup-only' }}
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'plan' }}
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' || github.event.inputs.action == 'clean-and-apply' }}
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Terraform Destroy (Teardown)
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: terraform
        run: terraform destroy -auto-approve

      - name: Push Remote Terraform State
        if: always() && github.event.inputs.action != 'cleanup-only'
        run: |
          if [ -f terraform/terraform.tfstate ]; then
            echo "Syncing terraform.tfstate to S3..."
            aws s3 cp terraform/terraform.tfstate s3://${{ env.STATE_BUCKET }}/terraform.tfstate
          fi
