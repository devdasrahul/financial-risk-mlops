[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-risk-mlops"
version = "1.0.0"
description = "Closed-Loop Financial Risk MLOps Platform with Automated Drift Retraining & Agentic Audit Triage on AWS"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Rahul Devdas", email = "rahul@example.com" }
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=15.0.0,<16.0.0",
    "scikit-learn>=1.4.0,<1.5.0",
    "xgboost>=2.0.3,<2.1.0",
    "shap>=0.45.0,<0.46.0",
    "mlflow>=2.11.0,<3.0.0",
    "evidently>=0.4.15,<0.5.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "boto3>=1.34.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
